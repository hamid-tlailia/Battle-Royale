name: Unity build (Android APK + WebGL test)

# Builds the Unity version of Last War on GitHub's servers (no local Unity needed).
# Repository secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE (contents of Unity_lic.ulf).
# Build files are kept for 1 day only (download them right away) so Actions storage stays small.

on:
  push:
    branches: [ claude/lowpoly-battle-royale-mvp-h7urn3, main ]
    paths: [ 'unity/**', '.github/workflows/unity-build.yml' ]
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # (the APK is also published on the release "unity-latest", below)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            method: LastWar.EditorTools.BuildScript.BuildAndroid
            out: unity/build/Android/*.apk
            name: LastWar-APK
          - platform: WebGL
            method: LastWar.EditorTools.BuildScript.BuildWebGL
            out: unity/build/WebGL
            name: LastWar-WebGL
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.platform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.85f1
          projectPath: unity
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}
          retention-days: 1
          if-no-files-found: error

      # the APK also as a plain file to download (no zip): phones' file managers stopped extracting the ~190 MB zip at
      # 66 MB and the cut APK would not install. Release "unity-latest" (pre-release), its LastWar.apk replaced every build
      - name: Publish the APK on the release "unity-latest"
        if: matrix.platform == 'Android'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls unity/build/Android/*.apk | head -1); cp "$f" LastWar.apk
          tag=unity-latest
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "${{ github.sha }}" --title "Last War - latest Android build" --notes "The latest APK (replaced on every build)."
          fi
          gh release upload "$tag" LastWar.apk --clobber
          gh release edit "$tag" --notes "Built from ${{ github.sha }} on $(date -u '+%Y-%m-%d %H:%M') UTC. Tap LastWar.apk to download it, then open it to install (no zip to extract)."
